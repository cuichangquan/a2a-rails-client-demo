name: A2A Rails published and candidate Client-only demo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  demo:
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: published
            gemfile: Gemfile
          - source: candidate
            gemfile: Gemfile.candidate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      A2A_GEM_SOURCE: ${{ matrix.source }}
      A2A_CANDIDATE_SHA: e13b3ef06698990c6a7b9e1522bf09f7c38e31c5
      RAILS_ENV: test
      RACK_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.10'
          bundler-cache: false
      - run: bundle install
      - name: Verify published or exact candidate source
        run: |
          bundle exec ruby -e '
            require "bundler"
            require "a2a-rails"
            spec = Gem.loaded_specs.fetch("a2a-rails")
            source = Bundler.load.specs.find { |s| s.name == "a2a-rails" }&.source
            abort "wrong constant" unless A2A::Rails::VERSION == spec.version.to_s
            if ENV.fetch("A2A_GEM_SOURCE") == "published"
              abort "wrong published source" unless spec.version.to_s == "0.3.0" && source.is_a?(Bundler::Source::Rubygems)
            else
              abort "wrong candidate source" unless source.is_a?(Bundler::Source::Git) && source.revision == ENV.fetch("A2A_CANDIDATE_SHA")
            end
            json_spec = Bundler.load.specs.find { |s| s.name == "json" }
            imap_spec = Bundler.load.specs.find { |s| s.name == "net-imap" }
            abort "unpatched json" unless json_spec && Gem::Requirement.new(">= 2.19.9", "< 3").satisfied_by?(json_spec.version)
            abort "unpatched net-imap" unless imap_spec && Gem::Requirement.new("~> 0.5.15").satisfied_by?(imap_spec.version)
            puts "PASS #{ENV.fetch("A2A_GEM_SOURCE")} source, json #{json_spec.version}, net-imap #{imap_spec.version}"
          '
      - name: Verify Client-only route isolation and probe behavior
        run: bundle exec rake test
      - name: Refuse production boot (demo-only)
        run: |
          if RAILS_ENV=production bundle exec rails runner 'puts "bad"' > "$RUNNER_TEMP/production-guard.log" 2>&1; then
            echo "Unexpected production boot!" >&2
            exit 1
          fi
          grep -q "Client demo is local-only" "$RUNNER_TEMP/production-guard.log"
