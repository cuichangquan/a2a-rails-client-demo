name: A2A Rails continuation published 0.5.1 Client-only demo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BUNDLE_GEMFILE: Gemfile
      RAILS_ENV: test
      RACK_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.10'
          bundler-cache: false
      - run: bundle install
      - name: Verify published package and host dependencies
        run: bundle exec ruby bin/verify_release
      - name: Verify Client-only route isolation and probe behavior
        run: bundle exec rake test
      - name: Refuse production boot (demo-only)
        run: |
          if RAILS_ENV=production bundle exec rails runner 'puts "bad"' > "$RUNNER_TEMP/production-guard.log" 2>&1; then
            echo "Unexpected production boot!" >&2
            exit 1
          fi
          grep -q "Client demo is local-only" "$RUNNER_TEMP/production-guard.log"
